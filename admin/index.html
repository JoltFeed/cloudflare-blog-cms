  <script>
    // --- IndexedDB Database Setup ---
    const DB_NAME = 'JoltFeedDB';
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('posts')) {
            db.createObjectStore('posts', { keyPath: 'id' });
          }
          if (!db.objectStoreNames.contains('settings')) {
            db.createObjectStore('settings', { keyPath: 'key' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function savePostToDB(post) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('posts', 'readwrite');
        tx.objectStore('posts').put(post);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getPostsFromDB() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('posts', 'readonly');
        const req = tx.objectStore('posts').getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function deletePostFromDB(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('posts', 'readwrite');
        tx.objectStore('posts').delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function saveConfigToDB(config) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('settings', 'readwrite');
        tx.objectStore('settings').put({ key: 'adConfig', value: config });
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function getConfigFromDB() {
      const db = await openDB();
      return new Promise((resolve) => {
        const tx = db.transaction('settings', 'readonly');
        const req = tx.objectStore('settings').get('adConfig');
        req.onsuccess = () => resolve(req.result ? req.result.value : null);
        req.onerror = () => resolve(null);
      });
    }

    // --- Toast & UI Helpers ---
    function showToast(msg) {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').innerText = msg;
      t.classList.remove('hidden');
      setTimeout(() => t.classList.add('hidden'), 3500);
    }

    // --- Authentication ---
    function checkAuth() {
      if (sessionStorage.getItem('joltfeed_auth') === 'true') {
        document.getElementById('login-container').classList.add('hidden');
        document.getElementById('admin-nav').classList.remove('hidden');
        document.getElementById('admin-content').classList.remove('hidden');
        initDashboard();
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById('login-username').value.trim();
      const p = document.getElementById('login-password').value.trim();
      if (u === 'admin' && p === 'admin123') {
        sessionStorage.setItem('joltfeed_auth', 'true');
        checkAuth();
      } else {
        const alt = document.getElementById('login-alert');
        alt.innerText = 'Invalid username or password.';
        alt.classList.remove('hidden');
      }
    }

    function logout() {
      sessionStorage.removeItem('joltfeed_auth');
      location.reload();
    }

    function initDashboard() {
      renderPostsList();
      loadAdSettings();
    }

    // --- Navigation Tabs ---
    function switchTab(tab) {
      ['posts', 'editor', 'settings'].forEach(t => {
        const el = document.getElementById(`tab-${t}`);
        if (el) el.classList.add('hidden');
        const btn = document.getElementById(`nav-btn-${t}`);
        if (btn) {
          btn.className = 'px-3.5 py-2 rounded-md hover:bg-gray-800 text-gray-300 transition';
        }
      });
      const activeTab = document.getElementById(`tab-${tab}`);
      if (activeTab) activeTab.classList.remove('hidden');
      const activeBtn = document.getElementById(`nav-btn-${tab}`);
      if (activeBtn) {
        activeBtn.className = 'px-3.5 py-2 rounded-md bg-amber-500 text-gray-900 font-semibold hover:bg-amber-400 transition';
      }

      if (tab === 'posts') renderPostsList();
      if (tab === 'settings') loadAdSettings();
    }

    // --- Canvas Image Compression ---
    function compressImage(file, maxWidth = 1200, quality = 0.8) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            resolve(canvas.toDataURL('image/jpeg', quality));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // --- Visual Editor Functions ---
    function formatDoc(cmd, val = null) {
      document.execCommand(cmd, false, val);
      document.getElementById('post-content-editor').focus();
    }

    function toggleCodeView() {
      const ed = document.getElementById('post-content-editor');
      const raw = document.getElementById('post-content-raw');
      const btn = document.getElementById('btn-toggle-html');
      
      if (raw.classList.contains('hidden')) {
        raw.value = ed.innerHTML;
        ed.classList.add('hidden');
        raw.classList.remove('hidden');
        btn.innerHTML = '<span>Visual View</span>';
      } else {
        ed.innerHTML = raw.value;
        raw.classList.add('hidden');
        ed.classList.remove('hidden');
        btn.innerHTML = '<span>HTML View</span>';
      }
    }

    function getEditorHTML() {
      const ed = document.getElementById('post-content-editor');
      const raw = document.getElementById('post-content-raw');
      return raw.classList.contains('hidden') ? ed.innerHTML : raw.value;
    }

    function insertHTMLAtCursor(html) {
      const ed = document.getElementById('post-content-editor');
      ed.focus();
      if (document.queryCommandSupported('insertHTML')) {
        document.execCommand('insertHTML', false, html);
      } else {
        ed.innerHTML += html;
      }
    }

    // Process & Insert Multi-Image / Video Uploads
    async function handleMultiMediaSelect(e) {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      
      for (const file of files) {
        if (file.type.startsWith('image/')) {
          const compressed = await compressImage(file);
          insertHTMLAtCursor(`<img src="${compressed}" alt="${file.name}" class="max-w-full h-auto rounded-lg my-4 shadow-md" />`);
        } else if (file.type.startsWith('video/')) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            insertHTMLAtCursor(`<video controls src="${evt.target.result}" class="max-w-full rounded-lg my-4 shadow-md"></video>`);
          };
          reader.readAsDataURL(file);
        }
      }
      e.target.value = '';
    }

    async function handleFeaturedImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const compressed = await compressImage(file);
      document.getElementById('post-featured-image').value = compressed;
    }

    function promptInsertVideo() {
      const url = prompt('Enter Video URL (e.g., https://example.com/video.mp4 or YouTube URL):');
      if (!url) return;
      insertMediaURL(url);
    }

    function insertMediaURL(url) {
      url = url.trim();
      if (url.includes('youtube.com/watch') || url.includes('youtu.be/')) {
        let vid = '';
        if (url.includes('youtu.be/')) vid = url.split('youtu.be/')[1].split('?')[0];
        else vid = new URLSearchParams(new URL(url).search).get('v');
        if (vid) {
          const iframe = `<div class="aspect-video w-full my-4"><iframe src="https://www.youtube.com/embed/${vid}" class="w-full h-full rounded-lg shadow" allowfullscreen></iframe></div>`;
          insertHTMLAtCursor(iframe);
          return;
        }
      }
      
      if (url.match(/\.(mp4|webm|ogg)$/i)) {
        insertHTMLAtCursor(`<video controls src="${url}" class="max-w-full rounded-lg my-4 shadow-md"></video>`);
      } else if (url.match(/\.(jpeg|jpg|gif|png|webp)$/i) || url.startsWith('data:image')) {
        insertHTMLAtCursor(`<img src="${url}" class="max-w-full h-auto rounded-lg my-4 shadow-md" />`);
      } else {
        insertHTMLAtCursor(`<p><a href="${url}" target="_blank" class="text-amber-600 underline">${url}</a></p>`);
      }
    }

    // Auto-Generate Rich Sample Post

    function autoGenerateSlug() {
      const title = document.getElementById('post-title').value;
      document.getElementById('post-slug').value = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
    }

    // --- Clipboard Paste & Drag-and-Drop Handlers ---
    function setupEditorDragDropPaste() {
      const ed = document.getElementById('post-content-editor');
      if (!ed) return;

      ed.addEventListener('paste', async (e) => {
        if (e.clipboardData && e.clipboardData.files && e.clipboardData.files.length > 0) {
          e.preventDefault();
          for (const file of Array.from(e.clipboardData.files)) {
            if (file.type.startsWith('image/')) {
              const compressed = await compressImage(file);
              insertHTMLAtCursor(`<img src="${compressed}" alt="Pasted Image" class="max-w-full h-auto rounded-lg my-4 shadow-md" />`);
            } else if (file.type.startsWith('video/')) {
              const reader = new FileReader();
              reader.onload = (evt) => {
                insertHTMLAtCursor(`<video controls src="${evt.target.result}" class="max-w-full rounded-lg my-4 shadow-md"></video>`);
              };
              reader.readAsDataURL(file);
            }
          }
          return;
        }

        const pastedText = (e.clipboardData || window.clipboardData).getData('text');
        if (pastedText && (pastedText.startsWith('http://') || pastedText.startsWith('https://'))) {
          if (pastedText.match(/\.(jpeg|jpg|gif|png|webp)$/i) || pastedText.match(/\.(mp4|webm|ogg)$/i) || pastedText.includes('youtube.com') || pastedText.includes('youtu.be')) {
            e.preventDefault();
            insertMediaURL(pastedText);
          }
        }
      });

      ed.addEventListener('dragover', (e) => e.preventDefault());

      ed.addEventListener('drop', async (e) => {
        e.preventDefault();
        if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
          for (const file of Array.from(e.dataTransfer.files)) {
            if (file.type.startsWith('image/')) {
              const compressed = await compressImage(file);
              insertHTMLAtCursor(`<img src="${compressed}" alt="Dropped Image" class="max-w-full h-auto rounded-lg my-4 shadow-md" />`);
            } else if (file.type.startsWith('video/')) {
              const reader = new FileReader();
              reader.onload = (evt) => {
                insertHTMLAtCursor(`<video controls src="${evt.target.result}" class="max-w-full rounded-lg my-4 shadow-md"></video>`);
              };
              reader.readAsDataURL(file);
            }
          }
        }
      });
    }

    // --- Post Management ---
    function openNewPostEditor() {
      document.getElementById('editor-heading').innerText = "Create New Post";
      document.getElementById('post-id').value = '';
      document.getElementById('post-title').value = '';
      document.getElementById('post-slug').value = '';
      document.getElementById('post-category').value = '';
      document.getElementById('post-author').value = 'JoltFeed Team';
      document.getElementById('post-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('post-featured-image').value = '';
      document.getElementById('post-excerpt').value = '';
      document.getElementById('post-tags').value = '';
      document.getElementById('post-content-editor').innerHTML = '';
      document.getElementById('post-content-raw').value = '';
      switchTab('editor');
    }

    async function editPost(id) {
      const posts = await getPostsFromDB();
      const p = posts.find(x => x.id === id);
      if (!p) return;

      document.getElementById('editor-heading').innerText = "Edit Post";
      document.getElementById('post-id').value = p.id;
      document.getElementById('post-title').value = p.title || '';
      document.getElementById('post-slug').value = p.slug || '';
      document.getElementById('post-category').value = p.category || '';
      document.getElementById('post-author').value = p.author || 'JoltFeed Team';
      document.getElementById('post-date').value = p.date || new Date().toISOString().split('T')[0];
      document.getElementById('post-featured-image').value = p.featuredImage || p.image || '';
      document.getElementById('post-excerpt').value = p.excerpt || '';
      document.getElementById('post-tags').value = Array.isArray(p.tags) ? p.tags.join(', ') : (p.tags || '');

      const content = p.content || '';
      document.getElementById('post-content-editor').innerHTML = content;
      document.getElementById('post-content-raw').value = content;
      switchTab('editor');
    }

    async function savePost() {
      const title = document.getElementById('post-title').value.trim();
      if (!title) {
        alert('Please enter a post title.');
        return;
      }

      const id = document.getElementById('post-id').value || 'post-' + Date.now();
      const slug = document.getElementById('post-slug').value.trim() || title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      const category = document.getElementById('post-category').value.trim() || 'General';
      const author = document.getElementById('post-author').value.trim() || 'JoltFeed Team';
      const date = document.getElementById('post-date').value || new Date().toISOString().split('T')[0];
      const featuredImage = document.getElementById('post-featured-image').value.trim();
      const excerpt = document.getElementById('post-excerpt').value.trim();
      const tags = document.getElementById('post-tags').value.split(',').map(t => t.trim()).filter(Boolean);
      const content = getEditorHTML();

      const postObj = { id, title, slug, category, author, date, featuredImage, image: featuredImage, excerpt, tags, content, updatedAt: Date.now() };

      await savePostToDB(postObj);

      const allPosts = await getPostsFromDB();
      try {
        localStorage.setItem('joltfeed_posts', JSON.stringify(allPosts));
        localStorage.setItem('posts', JSON.stringify(allPosts));
      } catch (err) {
        console.warn('localStorage limit reached, stored in IndexedDB:', err);
      }

      showToast('Post published & saved successfully!');
      switchTab('posts');
    }

    async function deletePost(id) {
      if (!confirm('Are you sure you want to delete this post?')) return;
      await deletePostFromDB(id);
      const remaining = await getPostsFromDB();
      try {
        localStorage.setItem('joltfeed_posts', JSON.stringify(remaining));
        localStorage.setItem('posts', JSON.stringify(remaining));
      } catch (e) {}
      showToast('Post deleted.');
      renderPostsList();
    }

    async function renderPostsList() {
      const container = document.getElementById('posts-list-container');
      if (!container) return;
      const search = (document.getElementById('posts-search')?.value || '').toLowerCase();
      let posts = await getPostsFromDB();

      if (!posts || posts.length === 0) {
        const local = localStorage.getItem('joltfeed_posts') || localStorage.getItem('posts');
        if (local) {
          try {
            posts = JSON.parse(local);
            for (const p of posts) await savePostToDB(p);
          } catch (e) {}
        }
      }

      const filtered = posts.filter(p => (p.title || '').toLowerCase().includes(search));
      const cnt = document.getElementById('posts-count');
      if (cnt) cnt.innerText = `${filtered.length} Posts`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="p-8 text-center text-gray-500 text-sm">No posts found. Click "+ Create New Post" above to write your first article.</div>`;
        return;
      }

      container.innerHTML = filtered.map(p => `
        <div class="p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-gray-50 transition">
          <div class="flex items-center gap-4">
            ${p.featuredImage || p.image ? `<img src="${p.featuredImage || p.image}" class="w-16 h-12 object-cover rounded-lg border border-gray-200" />` : `<div class="w-16 h-12 bg-amber-100 rounded-lg flex items-center justify-center font-bold text-amber-800 text-xs">Jolt</div>`}
            <div>
              <h4 class="font-bold text-gray-900 text-base">${p.title}</h4>
              <p class="text-xs text-gray-500 flex items-center gap-2 mt-0.5">
                <span class="bg-gray-100 text-gray-700 px-2 py-0.5 rounded font-mono">${p.category || 'General'}</span>
                <span>${p.date || ''}</span>
                <span>• by ${p.author || 'Admin'}</span>
              </p>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <a href="../index.html?post=${p.id}" target="_blank" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-semibold rounded-md transition">Preview ↗</a>
            <button onclick="editPost('${p.id}')" class="px-3 py-1.5 bg-amber-100 hover:bg-amber-200 text-amber-900 text-xs font-semibold rounded-md transition">Edit</button>
            <button onclick="deletePost('${p.id}')" class="px-3 py-1.5 bg-red-100 hover:bg-red-200 text-red-700 text-xs font-semibold rounded-md transition">Delete</button>
          </div>
        </div>
      `).join('');
    }

    // --- Ad Settings Management ---
    async function saveAdSettings() {
      const config = {
        enableBeforeTitle: document.getElementById('enableBeforeTitle').checked,
        adBeforeTitle: document.getElementById('adBeforeTitle').value,
        enableBeforeFirstImage: document.getElementById('enableBeforeFirstImage').checked,
        adBeforeFirstImage: document.getElementById('adBeforeFirstImage').value,
        enableBetweenParagraphs: document.getElementById('enableBetweenParagraphs').checked,
        adParagraphFrequency: document.getElementById('adParagraphFrequency').value || "1",
        adBetweenParagraphs: document.getElementById('adBetweenParagraphs').value,
        enableAfterPost: document.getElementById('enableAfterPost').checked,
        adAfterPost: document.getElementById('adAfterPost').value,
        globalHeaderScript: document.getElementById('globalHeaderScript').value,
        showAdPlaceholders: document.getElementById('showAdPlaceholders').checked
      };

      await saveConfigToDB(config);
      localStorage.setItem('joltfeed_config', JSON.stringify(config));
      localStorage.setItem('config', JSON.stringify(config));

      showToast('Ad Settings Saved Successfully!');
    }

    async function loadAdSettings() {
      let config = await getConfigFromDB();
      if (!config) {
        const local = localStorage.getItem('joltfeed_config') || localStorage.getItem('config');
        if (local) {
          try { config = JSON.parse(local); } catch (e) {}
        }
      }

      if (!config) {
        config = {
          enableBeforeTitle: true,
          adBeforeTitle: '',
          enableBeforeFirstImage: true,
          adBeforeFirstImage: '',
          enableBetweenParagraphs: true,
          adParagraphFrequency: '1',
          adBetweenParagraphs: '',
          enableAfterPost: true,
          adAfterPost: '',
          globalHeaderScript: '',
          showAdPlaceholders: true
        };
      }

      document.getElementById('enableBeforeTitle').checked = !!config.enableBeforeTitle;
      document.getElementById('adBeforeTitle').value = config.adBeforeTitle || '';
      document.getElementById('enableBeforeFirstImage').checked = !!config.enableBeforeFirstImage;
      document.getElementById('adBeforeFirstImage').value = config.adBeforeFirstImage || '';
      document.getElementById('enableBetweenParagraphs').checked = !!config.enableBetweenParagraphs;
      document.getElementById('adParagraphFrequency').value = config.adParagraphFrequency || '1';
      document.getElementById('adBetweenParagraphs').value = config.adBetweenParagraphs || '';
      document.getElementById('enableAfterPost').checked = !!config.enableAfterPost;
      document.getElementById('adAfterPost').value = config.adAfterPost || '';
      document.getElementById('globalHeaderScript').value = config.globalHeaderScript || '';
      document.getElementById('showAdPlaceholders').checked = config.showAdPlaceholders !== false;
    }

    window.addEventListener('DOMContentLoaded', () => {
      checkAuth();
      setupEditorDragDropPaste();
      const dt = document.getElementById('post-date');
      if (dt) dt.value = new Date().toISOString().split('T')[0];
    });
  </script>
