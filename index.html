<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JoltFeed - Minimal Editorial Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .serif-title { font-family: Georgia, Cambria, "Times New Roman", Times, serif; }
    .p
  <script>
    const DB_NAME = 'JoltFeedDB';
    const DB_VERSION = 1;

    function openDB() {
      return new Promise((resolve) => {
        const req = indexedDB.open(DB_NAME, DB_VERSION);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains('posts')) db.createObjectStore('posts', { keyPath: 'id' });
          if (!db.objectStoreNames.contains('settings')) db.createObjectStore('settings', { keyPath: 'key' });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => resolve(null);
      });
    }

    async function loadData() {
      let posts = [], config = null;
      try {
        const db = await openDB();
        if (db) {
          posts = await new Promise(res => {
            const tx = db.transaction('posts', 'readonly');
            const r = tx.objectStore('posts').getAll();
            r.onsuccess = () => res(r.result || []);
            r.onerror = () => res([]);
          });

          config = await new Promise(res => {
            const tx = db.transaction('settings', 'readonly');
            const r = tx.objectStore('settings').get('adConfig');
            r.onsuccess = () => res(r.result ? r.result.value : null);
            r.onerror = () => res(null);
          });
        }
      } catch (e) {}

      // LocalStorage Fallback
      if (!posts || posts.length === 0) {
        const local = localStorage.getItem('joltfeed_posts') || localStorage.getItem('posts');
        if (local) {
          try { posts = JSON.parse(local); } catch (e) {}
        }
      }

      if (!config) {
        const localConfig = localStorage.getItem('joltfeed_config') || localStorage.getItem('config');
        if (localConfig) {
          try { config = JSON.parse(localConfig); } catch (e) {}
        }
      }

      // Remote JSON Fallback
      if (!posts || posts.length === 0) {
        try {
          const res = await fetch('posts.json');
          posts = await res.json();
        } catch (e) { posts = []; }
      }

      if (!config) {
        try {
          const res = await fetch('config.json');
          config = await res.json();
        } catch (e) {
          config = {
            enableBeforeTitle: true,
            adBeforeTitle: '',
            enableBeforeFirstImage: true,
            adBeforeFirstImage: '',
            enableBetweenParagraphs: true,
            adParagraphFrequency: '1',
            adBetweenParagraphs: '',
            enableAfterPost: true,
            adAfterPost: '',
            globalHeaderScript: '',
            showAdPlaceholders: true
          };
        }
      }

      return { posts, config };
    }

    function injectGlobalHeaderScript(scriptCode) {
      if (!scriptCode || !scriptCode.trim()) return;
      const holder = document.createElement('div');
      holder.innerHTML = scriptCode;
      Array.from(holder.childNodes).forEach(node => {
        if (node.tagName === 'SCRIPT') {
          const s = document.createElement('script');
          Array.from(node.attributes).forEach(attr => s.setAttribute(attr.name, attr.value));
          s.textContent = node.textContent;
          document.head.appendChild(s);
        }
      });
    }

    function renderAdSlotHTML(slotName, code, enabled, showPlaceholder) {
      if (!enabled) return '';
      if (code && code.trim()) {
        const id = 'ad-slot-' + Math.random().toString(36).substring(2, 9);
        setTimeout(() => {
          const el = document.getElementById(id);
          if (el) {
            el.innerHTML = code;
            Array.from(el.querySelectorAll('script')).forEach(oldScript => {
              const newScript = document.createElement('script');
              Array.from(oldScript.attributes).forEach(a => newScript.setAttribute(a.name, a.value));
              newScript.textContent = oldScript.textContent;
              oldScript.parentNode.replaceChild(newScript, oldScript);
            });
          }
        }, 50);
        return `<div id="${id}" class="my-6"></div>`;
      } else if (showPlaceholder) {
        return `<div class="ad-placeholder"><div class="ad-label">[Ad Slot: ${slotName}]</div><div class="text-xs text-amber-700 mt-1 font-mono">Active slot (no code entered yet)</div></div>`;
      }
      return '';
    }

    function goHome() {
      history.pushState({}, '', window.location.pathname);
      initApp();
    }

    async function initApp() {
      const container = document.getElementById('app-container');
      const { posts, config } = await loadData();

      if (config && config.globalHeaderScript) {
        injectGlobalHeaderScript(config.globalHeaderScript);
      }

      const params = new URLSearchParams(window.location.search);
      const postId = params.get('post');

      if (postId) {
        const post = posts.find(p => p.id === postId || p.slug === postId);
        if (post) {
          renderArticleView(container, post, config);
          return;
        }
      }

      renderFeedView(container, posts);
    }

    function renderFeedView(container, posts) {
      if (!posts || posts.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-12 rounded-2xl border border-gray-200 text-center shadow-sm">
            <h3 class="text-xl font-bold text-gray-800">No Posts Published Yet</h3>
            <p class="text-sm text-gray-500 mt-2">Log into the admin panel to publish your first article with visual media and ad slots.</p>
            <a href="./admin/" class="mt-6 inline-block px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-gray-900 font-bold rounded-lg transition shadow">Go to Admin Panel ↗</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="space-y-8">
          <div class="border-b border-gray-200 pb-4">
            <h1 class="text-3xl font-extrabold text-gray-900 serif-title">Latest Articles</h1>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            ${posts.map(p => `
              <article class="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm hover:shadow-md transition flex flex-col cursor-pointer" onclick="window.location.search='?post=${p.id}'">
                ${p.featuredImage || p.image ? `<img src="${p.featuredImage || p.image}" alt="${p.title}" class="w-full h-48 object-cover" />` : `<div class="w-full h-48 bg-amber-100 flex items-center justify-center text-amber-800 font-extrabold text-2xl serif-title">JoltFeed</div>`}
                <div class="p-6 flex-grow flex flex-col justify-between">
                  <div>
                    <span class="text-xs font-bold text-amber-600 uppercase tracking-wider">${p.category || 'Article'}</span>
                    <h2 class="text-xl font-bold text-gray-900 mt-1 mb-2 hover:text-amber-600 transition leading-snug">${p.title}</h2>
                    <p class="text-sm text-gray-600 line-clamp-3 leading-relaxed">${p.excerpt || (p.content ? p.content.replace(/<[^>]+>/g, '').substring(0, 140) + '...' : '')}</p>
                  </div>
                  <div class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between text-xs text-gray-500">
                    <span>${p.date || ''}</span>
                    <span class="font-semibold text-gray-900">Read Article →</span>
                  </div>
                </div>
              </article>
            `).join('')}
          </div>
        </div>
      `;
    }

    function renderArticleView(container, post, config) {
      const showPlaceholder = config.showAdPlaceholders !== false;

      // 1. Before Title Ad Slot
      const beforeTitleAd = renderAdSlotHTML('Before Title', config.adBeforeTitle, config.enableBeforeTitle, showPlaceholder);

      // 2. Before First Image Ad Slot
      const beforeFirstImageAd = renderAdSlotHTML('Before First Image', config.adBeforeFirstImage, config.enableBeforeFirstImage, showPlaceholder);

      // Process Body & Insert Between Paragraphs Ads
      let rawContent = post.content || '';
      
      // Inject Before First Image Ad right before first img or video tag if present
      if (beforeFirstImageAd) {
        if (rawContent.match(/<img|<video|<iframe/i)) {
          rawContent = rawContent.replace(/(<img|<video|<iframe)/i, `${beforeFirstImageAd}$1`);
        } else {
          rawContent = beforeFirstImageAd + rawContent;
        }
      }

      // Insert Between Paragraphs Ad Slots after every N paragraphs/blocks
      let processedContent = rawContent;
      if (config.enableBetweenParagraphs) {
        const freq = parseInt(config.adParagraphFrequency) || 1;
        const betweenAd = renderAdSlotHTML('Between Paragraphs', config.adBetweenParagraphs, true, showPlaceholder);
        
        let pCount = 0;
        processedContent = rawContent.replace(/(<\/p>|<\/div>|<img[^>]*>|<video[^>]*><\/video>)/gi, (match) => {
          pCount++;
          if (pCount % freq === 0) {
            return match + betweenAd;
          }
          return match;
        });
      }

      // 4. After Post Ad Slot
      const afterPostAd = renderAdSlotHTML('After Post', config.adAfterPost, config.enableAfterPost, showPlaceholder);

      container.innerHTML = `
        <article class="bg-white rounded-2xl border border-gray-200 p-6 sm:p-10 shadow-sm max-w-3xl mx-auto">
          
          <!-- Before Title Ad -->
          ${beforeTitleAd}

          <!-- Header -->
          <header class="space-y-3 mb-6">
            <div class="flex items-center space-x-2">
              <span class="px-2.5 py-1 bg-amber-100 text-amber-800 text-xs font-bold rounded-full uppercase tracking-wider">${post.category || 'General'}</span>
              <span class="text-xs text-gray-400">• ${post.date || ''}</span>
            </div>
            <h1 class="text-3xl sm:text-4xl font-extrabold text-gray-900 serif-title leading-tight">${post.title}</h1>
            <p class="text-xs text-gray-500">By <span class="font-semibold text-gray-800">${post.author || 'JoltFeed Team'}</span></p>
          </header>

          <!-- Featured Image -->
          ${post.featuredImage || post.image ? `
            <div class="my-6">
              <img src="${post.featuredImage || post.image}" alt="${post.title}" class="w-full h-auto max-h-[450px] object-cover rounded-xl shadow-sm" />
            </div>
          ` : ''}

          <!-- Main Prose Content -->
          <div class="prose-editorial text-gray-800 border-t border-gray-100 pt-6">
            ${processedContent}
          </div>

          <!-- After Post Ad -->
          ${afterPostAd}

          <!-- Tags -->
          ${post.tags && post.tags.length ? `
            <div class="mt-8 pt-4 border-t border-gray-100 flex flex-wrap gap-2">
              ${(Array.isArray(post.tags) ? post.tags : post.tags.split(',')).map(t => `<span class="px-2.5 py-1 bg-gray-100 text-gray-600 text-xs rounded-md">#${t.trim()}</span>`).join('')}
            </div>
          ` : ''}

          <div class="mt-10 pt-6 border-t border-gray-200 flex justify-between items-center">
            <button onclick="goHome()" class="px-4 py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-bold rounded-lg transition">← Back to Articles</button>
            <a href="./admin/" class="text-xs text-amber-600 font-semibold hover:underline">Edit in Admin Panel →</a>
          </div>

        </article>
      `;
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html
