<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloudflare Blog CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .prose img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1.5rem 0; }
    .prose video { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1.5rem 0; }
    .prose iframe { width: 100%; aspect-ratio: 16/9; border-radius: 0.5rem; margin: 1.5rem 0; }
    .ad-slot { min-height: 90px; text-align: center; margin: 1.5rem 0; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen flex flex-col">

  <!-- Progress Bar -->
  <div id="progressBar" class="fixed top-0 left-0 h-1 bg-indigo-600 z-50 transition-all duration-150" style="width: 0%"></div>

  <!-- Header / Navigation -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/" onclick="goHome(event)" class="text-2xl font-bold tracking-tight text-indigo-600 flex items-center gap-2">
        <span>⚡ Cloudflare Blog</span>
      </a>
      <div class="flex items-center gap-3">
        <a href="/admin/" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition">
          Admin Dashboard
        </a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-8">
    
    <!-- Home View -->
    <div id="homeView">
      <div class="mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
        <div>
          <h1 class="text-3xl font-extrabold text-gray-900">Latest Stories</h1>
          <p class="text-gray-500 mt-1">Explore articles on web development, Cloudflare Workers, and performance.</p>
        </div>
        <div class="w-full md:w-72">
          <input type="text" id="searchInput" placeholder="Search articles..." oninput="filterPosts()" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>
      </div>

      <div id="postsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <!-- Posts rendered dynamically -->
      </div>
    </div>

    <!-- Single Post View -->
    <div id="postView" class="hidden max-w-3xl mx-auto bg-white p-6 md:p-10 rounded-2xl shadow-sm border border-gray-100">
      <button onclick="goHome(event)" class="mb-6 inline-flex items-center gap-2 text-sm font-medium text-indigo-600 hover:text-indigo-800 transition">
        ← Back to all posts
      </button>

      <!-- Slot 1: Before Title -->
      <div id="ad-slot-1" class="ad-slot"></div>

      <h1 id="postTitle" class="text-3xl md:text-4xl font-extrabold text-gray-900 tracking-tight leading-tight mb-4"></h1>
      <div id="postMeta" class="text-sm text-gray-500 mb-6 flex items-center gap-4 border-b border-gray-100 pb-4"></div>

      <!-- Slot 2: Under Image -->
      <div id="postImageContainer" class="mb-6"></div>
      <div id="ad-slot-2" class="ad-slot"></div>

      <!-- Slot 3: Before Paragraph -->
      <div id="ad-slot-3" class="ad-slot"></div>

      <!-- Article Content -->
      <div id="postContent" class="prose prose-indigo max-w-none text-gray-800 text-lg leading-relaxed"></div>

      <!-- Slot 7: After Post -->
      <div id="ad-slot-7" class="ad-slot"></div>

      <!-- Share Buttons -->
      <div class="mt-8 pt-6 border-t border-gray-200">
        <h3 class="text-sm font-semibold text-gray-700 uppercase tracking-wider mb-4">Share this article</h3>
        <div class="flex flex-wrap gap-3" id="shareButtons"></div>
      </div>
    </div>
  </main>

  <!-- Popup Ad (Slot 8) -->
  <div id="popupAd" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl p-6 max-w-lg w-full relative shadow-2xl">
      <button onclick="closePopupAd()" class="absolute top-3 right-3 text-gray-400 hover:text-gray-600 text-xl font-bold px-2 py-1">×</button>
      <div id="ad-slot-8" class="ad-slot"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="bg-white border-t border-gray-200 mt-12 py-6 text-center text-sm text-gray-500">
    <p>© 2026 Cloudflare Blog CMS. Powered by Cloudflare Workers.</p>
  </footer>

  <script>
    let posts = [];
    let config = {};

    function getAdCode(slotKey) {
      if (!config.ads) return '';
      const ad = config.ads[slotKey];
      if (!ad || ad.enabled === false) return '';
      return ad.code || '';
    }

    function renderAd(elementId, slotKey) {
      const el = document.getElementById(elementId);
      if (!el) return;
      const code = getAdCode(slotKey);
      if (code) {
        el.innerHTML = code;
        executeScripts(el);
        el.classList.remove('hidden');
      } else {
        el.innerHTML = '';
        el.classList.add('hidden');
      }
    }

    function executeScripts(container) {
      const scripts = container.querySelectorAll('script');
      scripts.forEach(oldScript => {
        const newScript = document.createElement('script');
        Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
        newScript.appendChild(document.createTextNode(oldScript.innerHTML));
        oldScript.parentNode.replaceChild(newScript, oldScript);
      });
    }

    async function init() {
      if (window.__INITIAL_STATE__) {
        posts = window.__INITIAL_STATE__.posts || [];
        config = window.__INITIAL_STATE__.config || {};
      }

      try {
        const res = await fetch('/api/state?t=' + Date.now());
        if (res.ok) {
          const state = await res.json();
          posts = state.posts || posts;
          config = state.config || config;
        }
      } catch (e) {}

      route();
    }

    function route() {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get('p') || urlParams.get('post');

      if (postId) {
        const post = posts.find(p => String(p.id) === String(postId));
        if (post) {
          openPost(post, false);
          return;
        }
      }
      showHome();
    }

    function showHome() {
      document.getElementById('homeView').classList.remove('hidden');
      document.getElementById('postView').classList.add('hidden');
      renderPosts(posts);
    }

    function filterPosts() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = posts.filter(p => (p.title && p.title.toLowerCase().includes(q)) || (p.content && p.content.toLowerCase().includes(q)));
      renderPosts(filtered);
    }

    function renderPosts(list) {
      const container = document.getElementById('postsGrid');
      if (!list || list.length === 0) {
        container.innerHTML = '<div class="col-span-full text-center py-12 text-gray-500">No posts published yet.</div>';
        return;
      }

      container.innerHTML = list.map(post => {
        const img = post.image || post.featured_image || post.featuredImage || 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80';
        const date = post.date ? new Date(post.date).toLocaleDateString() : '';
        const excerpt = post.excerpt || (post.content ? post.content.replace(/<[^>]*>/g, '').substring(0, 120) + '...' : '');

        return `
          <div onclick="openPostById('${post.id}')" class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition cursor-pointer flex flex-col">
            <img src="${img}" alt="${escapeHtml(post.title)}" class="w-full h-48 object-cover" />
            <div class="p-5 flex-grow flex flex-col justify-between">
              <div>
                <span class="text-xs font-semibold uppercase text-indigo-600 tracking-wider">${escapeHtml(post.category || 'General')}</span>
                <h2 class="text-xl font-bold text-gray-900 mt-1 mb-2 line-clamp-2">${escapeHtml(post.title)}</h2>
                <p class="text-sm text-gray-600 line-clamp-3">${escapeHtml(excerpt)}</p>
              </div>
              <div class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between text-xs text-gray-400">
                <span>${date}</span>
                <span class="text-indigo-600 font-medium">Read Article →</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function openPostById(id) {
      const post = posts.find(p => String(p.id) === String(id));
      if (post) openPost(post, true);
    }

    function openPost(post, updateHistory = true) {
      if (updateHistory) {
        const shortUrl = '?p=' + encodeURIComponent(post.id);
        window.history.pushState({ postId: post.id }, '', shortUrl);
      }

      document.getElementById('homeView').classList.add('hidden');
      document.getElementById('postView').classList.remove('hidden');
      window.scrollTo(0, 0);

      document.getElementById('postTitle').innerText = post.title || '';
      document.getElementById('postMeta').innerHTML = `
        <span>By ${escapeHtml(post.author || 'Admin')}</span>
        <span>•</span>
        <span>${post.date ? new Date(post.date).toLocaleDateString() : ''}</span>
        <span>•</span>
        <span class="bg-indigo-50 text-indigo-700 px-2.5 py-0.5 rounded-full text-xs font-medium">${escapeHtml(post.category || 'General')}</span>
      `;

      const img = post.image || post.featured_image || post.featuredImage;
      const imgContainer = document.getElementById('postImageContainer');
      if (img) {
        imgContainer.innerHTML = `<img src="${img}" alt="${escapeHtml(post.title)}" class="w-full max-h-[450px] object-cover rounded-xl shadow-sm" />`;
      } else {
        imgContainer.innerHTML = '';
      }

      let contentHtml = post.content || '';
      const paragraphs = contentHtml.split(/(<\/p>|<br\s*\/?>\s*<br\s*\/?>)/i);
      if (paragraphs.length > 3) {
        const total = paragraphs.length;
        const p30 = Math.floor(total * 0.3);
        const p60 = Math.floor(total * 0.6);
        const p80 = Math.floor(total * 0.8);

        let formatted = '';
        paragraphs.forEach((p, index) => {
          formatted += p;
          if (index === p30 && getAdCode('slot4')) {
            formatted += `<div class="ad-slot">${getAdCode('slot4')}</div>`;
          }
          if (index === p60 && getAdCode('slot5')) {
            formatted += `<div class="ad-slot">${getAdCode('slot5')}</div>`;
          }
          if (index === p80 && getAdCode('slot6')) {
            formatted += `<div class="ad-slot">${getAdCode('slot6')}</div>`;
          }
        });
        contentHtml = formatted;
      }

      const contentEl = document.getElementById('postContent');
      contentEl.innerHTML = contentHtml;
      executeScripts(contentEl);

      renderAd('ad-slot-1', 'slot1');
      renderAd('ad-slot-2', 'slot2');
      renderAd('ad-slot-3', 'slot3');
      renderAd('ad-slot-7', 'slot7');

      if (getAdCode('slot8')) {
        renderAd('ad-slot-8', 'slot8');
        document.getElementById('popupAd').classList.remove('hidden');
      }

      const shareUrl = encodeURIComponent(window.location.origin + '/?p=' + post.id);
      const shareTitle = encodeURIComponent(post.title);
      document.getElementById('shareButtons').innerHTML = `
        <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="px-3.5 py-1.5 bg-blue-600 text-white text-xs font-semibold rounded-lg hover:bg-blue-700 transition">Facebook</a>
        <a href="https://twitter.com/intent/tweet?url=${shareUrl}&text=${shareTitle}" target="_blank" class="px-3.5 py-1.5 bg-sky-500 text-white text-xs font-semibold rounded-lg hover:bg-sky-600 transition">X / Twitter</a>
        <a href="https://api.whatsapp.com/send?text=${shareTitle}%20${shareUrl}" target="_blank" class="px-3.5 py-1.5 bg-green-500 text-white text-xs font-semibold rounded-lg hover:bg-green-600 transition">WhatsApp</a>
        <a href="https://t.me/share/url?url=${shareUrl}&text=${shareTitle}" target="_blank" class="px-3.5 py-1.5 bg-sky-600 text-white text-xs font-semibold rounded-lg hover:bg-sky-700 transition">Telegram</a>
        <button onclick="copyShareLink('${window.location.origin}/?p=${post.id}')" class="px-3.5 py-1.5 bg-gray-200 text-gray-700 text-xs font-semibold rounded-lg hover:bg-gray-300 transition">Copy Link</button>
      `;
    }

    function closePopupAd() {
      document.getElementById('popupAd').classList.add('hidden');
    }

    function copyShareLink(link) {
      navigator.clipboard.writeText(link).then(() => alert('Link copied to clipboard!'));
    }

    function goHome(e) {
      if (e) e.preventDefault();
      window.history.pushState({}, '', '/');
      showHome();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    window.addEventListener('popstate', route);
    window.addEventListener('scroll', () => {
      const winScroll = document.body.scrollTop || document.documentElement.scrollTop;
      const height = document.documentElement.scrollHeight - document.documentElement.clientHeight;
      const scrolled = (winScroll / height) * 100;
      document.getElementById('progressBar').style.width = scrolled + '%';
    });

    init();
  </script>
</body>
</html>
