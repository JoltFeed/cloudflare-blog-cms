<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflare Blog CMS</title>
  <meta property="og:title" id="og-title" content="Cloudflare Blog CMS">
  <meta property="og:description" id="og-desc" content="A fast, minimal, high-CTR blog CMS hosted on Cloudflare.">
  <meta property="og:image" id="og-img" content="">
  <meta property="og:type" content="article">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" id="tw-title" content="Cloudflare Blog CMS">
  <meta name="twitter:description" id="tw-desc" content="A fast, minimal, high-CTR blog CMS hosted on Cloudflare.">
  <meta name="twitter:image" id="tw-img" content="">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .prose img { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1rem 0; }
    .prose video { max-width: 100%; height: auto; border-radius: 0.5rem; margin: 1rem 0; }
    .prose iframe { width: 100%; aspect-ratio: 16/9; border-radius: 0.5rem; margin: 1rem 0; }
    [contenteditable="true"]:empty:before { content: attr(placeholder); color: #9ca3af; pointer-events: none; display: block; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">
  <div id="app" class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
      <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
        <a href="./" onclick="routeToBlog(event)" class="text-2xl font-bold text-indigo-600 tracking-tight flex items-center gap-2">
          <span>⚡ Cloudflare Blog</span>
        </a>
        <div id="nav-actions" class="flex items-center gap-3">
          <button id="admin-nav-btn" onclick="routeToAdmin(event)" class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg shadow-sm transition">
            Admin Panel
          </button>
        </div>
      </div>
    </header>

    <div id="global-header-script"></div>

    <!-- Main Container -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 py-6">
      <!-- Public Blog View -->
      <section id="blog-view" class="space-y-6">
        <!-- Single Post View -->
        <div id="single-post-container" class="hidden bg-white rounded-xl shadow-md p-6 md:p-10 border border-gray-100">
          <button onclick="routeToBlog(event)" class="inline-flex items-center gap-2 text-sm font-medium text-indigo-600 hover:text-indigo-800 mb-6">
            ← Back to Articles
          </button>
          <article id="single-post-content" class="prose max-w-none"></article>
        </div>

        <!-- Post List View -->
        <div id="posts-list-container">
          <div class="flex items-center justify-between mb-6">
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">Latest Articles</h1>
          </div>
          <div id="posts-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
        </div>
      </section>

      <!-- Admin Panel View -->
      <section id="admin-view" class="hidden space-y-6">
        <!-- Admin Login Form -->
        <div id="admin-login-card" class="max-w-md mx-auto bg-white rounded-xl shadow-md p-8 border border-gray-100 mt-10">
          <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Admin Login</h2>
          <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
              <input type="text" id="login-username" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div>
              <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
              <input type="password" id="login-password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
            </div>
            <div id="login-error" class="text-red-500 text-sm hidden">Invalid username or password.</div>
            <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm transition">
              Sign In
            </button>
          </form>
        </div>

        <!-- Admin Dashboard -->
        <div id="admin-dashboard" class="hidden space-y-6">
          <!-- Admin Tabs Header -->
          <div class="flex flex-wrap items-center justify-between border-b border-gray-200 pb-4 gap-4">
            <div class="flex items-center gap-2">
              <button onclick="switchAdminTab('posts')" id="tab-btn-posts" class="px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white">Manage Posts</button>
              <button onclick="switchAdminTab('create')" id="tab-btn-create" class="px-4 py-2 text-sm font-semibold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Create / Edit Post</button>
              <button onclick="switchAdminTab('settings')" id="tab-btn-settings" class="px-4 py-2 text-sm font-semibold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200">Settings & Ad Placements</button>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="switchAdminTab('settings', true)" class="px-3 py-1.5 text-xs font-semibold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 rounded-md border border-indigo-200">
                🔒 Change Credentials
              </button>
              <button onclick="handleLogout()" class="px-3 py-1.5 text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 rounded-md border border-red-200">
                Logout
              </button>
            </div>
          </div>

          <!-- Tab 1: Posts List -->
          <div id="admin-tab-posts" class="bg-white rounded-xl shadow-md p-6 border border-gray-100">
            <div class="flex items-center justify-between mb-4">
              <h3 class="text-xl font-bold text-gray-900">All Posts</h3>
              <button onclick="openNewPostForm()" class="px-4 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-lg">
                + New Post
              </button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm text-gray-600">
                <thead class="bg-gray-50 text-gray-700 font-semibold border-b">
                  <tr>
                    <th class="py-3 px-4">Title</th>
                    <th class="py-3 px-4">Date</th>
                    <th class="py-3 px-4 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody id="admin-posts-tbody" class="divide-y border-b"></tbody>
              </table>
            </div>
          </div>

          <!-- Tab 2: Create / Edit Post -->
          <div id="admin-tab-create" class="hidden bg-white rounded-xl shadow-md p-6 border border-gray-100 space-y-6">
            <h3 id="post-editor-heading" class="text-xl font-bold text-gray-900">Create New Post</h3>
            <form id="post-form" onsubmit="handleSavePost(event)" class="space-y-4">
              <input type="hidden" id="post-edit-id">
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Post Title</label>
                <input type="text" id="post-title" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500">
              </div>

              <!-- Featured Image Upload & Preview -->
              <div class="bg-gray-50 p-4 rounded-lg border border-gray-200 space-y-3">
                <label class="block text-sm font-semibold text-gray-800">Featured Image</label>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Upload Featured Image</label>
                    <input type="file" accept="image/*" id="featured-image-file" onchange="handleFeaturedImageFileUpload(event)" class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                  </div>
                  <div>
                    <label class="block text-xs font-medium text-gray-600 mb-1">Or Featured Image URL</label>
                    <input type="url" id="featured-image-url" oninput="updateFeaturedImagePreview(this.value)" placeholder="https://example.com/image.jpg" class="w-full px-3 py-2 text-sm border border-gray-300 rounded-lg">
                  </div>
                </div>
                <div id="featured-image-preview-container" class="mt-2 hidden">
                  <p class="text-xs text-gray-500 mb-1">Thumbnail Preview:</p>
                  <img id="featured-image-preview" src="" alt="Featured Preview" class="h-32 w-auto object-cover rounded-md border border-gray-300">
                </div>
              </div>

              <!-- Visual Editor -->
              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Post Content</label>
                <!-- Toolbar -->
                <div class="flex flex-wrap items-center gap-2 p-2 bg-gray-100 border border-gray-300 rounded-t-lg">
                  <button type="button" onclick="execCmd('bold')" class="px-2 py-1 bg-white rounded border hover:bg-gray-50 font-bold">B</button>
                  <button type="button" onclick="execCmd('italic')" class="px-2 py-1 bg-white rounded border hover:bg-gray-50 italic">I</button>
                  <button type="button" onclick="execCmd('underline')" class="px-2 py-1 bg-white rounded border hover:bg-gray-50 underline">U</button>
                  <button type="button" onclick="execCmd('formatBlock', '<h2>')" class="px-2 py-1 bg-white rounded border hover:bg-gray-50">H2</button>
                  <button type="button" onclick="execCmd('formatBlock', '<h3>')" class="px-2 py-1 bg-white rounded border hover:bg-gray-50">H3</button>
                  <button type="button" onclick="execCmd('insertUnorderedList')" class="px-2 py-1 bg-white rounded border hover:bg-gray-50">• List</button>
                  <label class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded border border-indigo-200 cursor-pointer hover:bg-indigo-100">
                    📷 Add Media (Images/Videos)
                    <input type="file" accept="image/*,video/*" multiple onchange="handleMediaUpload(event)" class="hidden">
                  </label>
                </div>
                <!-- Editable Content Area -->
                <div id="post-editor" contenteditable="true" placeholder="Write article content here... (Supports paste and drag/drop media)" class="w-full min-h-[300px] p-4 border-x border-b border-gray-300 rounded-b-lg bg-white focus:outline-none prose max-w-none" onpaste="handlePasteMedia(event)"></div>
              </div>

              <div class="flex items-center gap-3">
                <button type="submit" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm">
                  Save Post
                </button>
                <button type="button" onclick="switchAdminTab('posts')" class="px-6 py-2.5 bg-gray-200 hover:bg-gray-300 text-gray-800 font-semibold rounded-lg">
                  Cancel
                </button>
              </div>
            </form>
          </div>

          <!-- Tab 3: Settings & Ad Placements -->
          <div id="admin-tab-settings" class="hidden space-y-6">
            <!-- Change Credentials Card -->
            <div id="credentials-card" class="bg-white rounded-xl shadow-md p-6 border border-gray-100 space-y-4">
              <h3 class="text-xl font-bold text-gray-900 flex items-center gap-2">
                🔒 Change Admin Username & Password
              </h3>
              <form id="credentials-form" onsubmit="handleChangeCredentials(event)" class="space-y-4 max-w-md">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">New Username</label>
                  <input type="text" id="new-admin-user" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
                  <input type="password" id="new-admin-pass" required class="w-full px-4 py-2 border border-gray-300 rounded-lg">
                </div>
                <div id="credentials-msg" class="text-sm font-medium hidden"></div>
                <button type="submit" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm">
                  Update Credentials
                </button>
              </form>
            </div>

            <!-- Ad Placements Settings -->
            <div class="bg-white rounded-xl shadow-md p-6 border border-gray-100 space-y-4">
              <h3 class="text-xl font-bold text-gray-900">Toggleable Ad Placements</h3>
              <div class="space-y-3">
                <label class="flex items-center gap-3">
                  <input type="checkbox" id="ad-before-title" class="w-5 h-5 text-indigo-600 rounded">
                  <span class="text-sm font-medium text-gray-800">Before Title</span>
                </label>
                <label class="flex items-center gap-3">
                  <input type="checkbox" id="ad-before-first-image" class="w-5 h-5 text-indigo-600 rounded">
                  <span class="text-sm font-medium text-gray-800">Before First Image</span>
                </label>
                <label class="flex items-center gap-3">
                  <input type="checkbox" id="ad-between-paragraphs" class="w-5 h-5 text-indigo-600 rounded">
                  <span class="text-sm font-medium text-gray-800">Between Paragraphs 1-to-1</span>
                </label>
                <label class="flex items-center gap-3">
                  <input type="checkbox" id="ad-after-post" class="w-5 h-5 text-indigo-600 rounded">
                  <span class="text-sm font-medium text-gray-800">After Post</span>
                </label>
              </div>

              <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Ad Code (HTML / Script)</label>
                <textarea id="ad-code-input" rows="4" placeholder="<div class='bg-yellow-100 p-4 text-center'>Ad Banner</div>" class="w-full p-3 border border-gray-300 rounded-lg font-mono text-sm"></textarea>
              </div>

              <button onclick="saveAdSettings()" class="px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg shadow-sm">
                Save Ad Settings
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script>
    // Initial Posts & State
    const DEFAULT_POSTS = [
      {
        id: "1",
        title: "Getting Started with Cloudflare Workers & Blog CMS",
        date: "2026-11-01",
        featured_image: "https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800",
        excerpt: "Learn how to build and host high-performance blogs using Cloudflare Workers and HTMLRewriter.",
        content: "<p>Cloudflare Workers allows you to run JavaScript at the edge with near-zero latency. In this guide, we explore how to leverage edge rendering and HTMLRewriter to serve fast, SEO-optimized blog content with dynamic open-graph social previews.</p><h2>Why Edge Hosting?</h2><p>Traditional serverless functions have cold start penalties. Workers execute instantly globally, delivering high CTR and instantaneous page loads.</p>"
      }
    ];

    function getPosts() {
      const stored = localStorage.getItem("cms_posts");
      if (!stored) {
        localStorage.setItem("cms_posts", JSON.stringify(DEFAULT_POSTS));
        return DEFAULT_POSTS;
      }
      try { return JSON.parse(stored); } catch(e) { return DEFAULT_POSTS; }
    }

    function savePosts(posts) {
      localStorage.setItem("cms_posts", JSON.stringify(posts));
    }

    function getAdSettings() {
      const stored = localStorage.getItem("cms_ad_settings");
      if (!stored) {
        return { beforeTitle: false, beforeFirstImage: false, betweenParagraphs: false, afterPost: false, code: "" };
      }
      try { return JSON.parse(stored); } catch(e) { return { beforeTitle: false, beforeFirstImage: false, betweenParagraphs: false, afterPost: false, code: "" }; }
    }

    function getAdminCredentials() {
      const u = localStorage.getItem("admin_username") || "admin";
      const p = localStorage.getItem("admin_password") || "admin123";
      return { user: u, pass: p };
    }

    // App Initialization & Routing
    document.addEventListener("DOMContentLoaded", () => {
      initApp();
      window.addEventListener("popstate", initApp);
    });

    function initApp() {
      const urlParams = new URLSearchParams(window.location.search);
      const postId = urlParams.get("post");
      const isNavAdmin = window.location.hash === "#admin" || window.location.pathname.includes("/admin");

      if (postId) {
        showSinglePost(postId);
      } else if (isNavAdmin) {
        showAdminView();
      } else {
        showBlogList();
      }
    }

    function routeToBlog(e) {
      if (e) e.preventDefault();
      history.pushState(null, "", window.location.pathname);
      showBlogList();
    }

    function routeToAdmin(e) {
      if (e) e.preventDefault();
      history.pushState(null, "", window.location.pathname + "#admin");
      showAdminView();
    }

    function showBlogList() {
      document.getElementById("blog-view").classList.remove("hidden");
      document.getElementById("admin-view").classList.add("hidden");
      document.getElementById("single-post-container").classList.add("hidden");
      document.getElementById("posts-list-container").classList.remove("hidden");

      renderPublicPosts();
    }

    function renderPublicPosts() {
      const posts = getPosts();
      const grid = document.getElementById("posts-grid");
      grid.innerHTML = "";

      posts.forEach(post => {
        let img = post.featured_image || post.featuredImage;
        if (!img && post.content) {
          const match = post.content.match(/<img[^>]+src=["']([^"']+)["']/i);
          if (match) img = match[1];
        }
        if (!img) img = "https://via.placeholder.com/600x400?text=No+Image";

        const card = document.createElement("div");
        card.className = "bg-white rounded-xl shadow-md overflow-hidden border border-gray-100 flex flex-col hover:shadow-lg transition cursor-pointer";
        card.onclick = () => {
          history.pushState(null, "", "?post=" + post.id);
          showSinglePost(post.id);
        };

        const excerptText = post.excerpt || (post.content ? post.content.replace(/<[^>]*>/g, '').slice(0, 120) + '...' : '');

        card.innerHTML = `
          <img src="${img}" alt="${post.title}" class="w-full h-48 object-cover">
          <div class="p-5 flex flex-col flex-grow">
            <div class="text-xs text-gray-500 mb-2">${post.date || ''}</div>
            <h2 class="text-xl font-bold text-gray-900 mb-2 hover:text-indigo-600 transition line-clamp-2">${post.title}</h2>
            <p class="text-gray-600 text-sm line-clamp-3 flex-grow">${excerptText}</p>
            <div class="mt-4 pt-3 border-t text-sm font-semibold text-indigo-600 flex items-center justify-between">
              <span>Read Full Article →</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function showSinglePost(id) {
      document.getElementById("blog-view").classList.remove("hidden");
      document.getElementById("admin-view").classList.add("hidden");
      document.getElementById("posts-list-container").classList.add("hidden");
      document.getElementById("single-post-container").classList.remove("hidden");

      const posts = getPosts();
      const post = posts.find(p => String(p.id) === String(id));
      const container = document.getElementById("single-post-content");

      if (!post) {
        container.innerHTML = "<h2 class='text-2xl font-bold text-red-600'>Article Not Found</h2>";
        return;
      }

      // Determine featured image
      let featuredImg = post.featured_image || post.featuredImage;
      if (!featuredImg && post.content) {
        const match = post.content.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (match) featuredImg = match[1];
      }

      // Update meta tags dynamically
      const excerpt = post.excerpt || (post.content ? post.content.replace(/<[^>]*>/g, '').slice(0, 160) : '');
      document.title = post.title + " - Cloudflare Blog CMS";
      updateMetaTag("og:title", post.title);
      updateMetaTag("og:description", excerpt);
      if (featuredImg) updateMetaTag("og:image", featuredImg);
      updateMetaTag("twitter:title", post.title, "name");
      updateMetaTag("twitter:description", excerpt, "name");
      if (featuredImg) updateMetaTag("twitter:image", featuredImg, "name");

      // Share URL containing parameters
      const baseUrl = window.location.origin + window.location.pathname;
      const shareUrl = `${baseUrl}?post=${post.id}&og_title=${encodeURIComponent(post.title)}&og_desc=${encodeURIComponent(excerpt)}&og_img=${encodeURIComponent(featuredImg || '')}`;

      const shareButtonsHtml = `
        <div class="my-6 p-4 bg-gray-50 rounded-xl border border-gray-200 flex flex-wrap items-center justify-between gap-3">
          <span class="text-sm font-semibold text-gray-700">Share this post:</span>
          <div class="flex items-center gap-2">
            <a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(shareUrl)}" target="_blank" class="px-3 py-1.5 bg-blue-600 text-white text-xs font-semibold rounded hover:bg-blue-700">Facebook</a>
            <a href="https://twitter.com/intent/tweet?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(post.title)}" target="_blank" class="px-3 py-1.5 bg-sky-500 text-white text-xs font-semibold rounded hover:bg-sky-600">Twitter / X</a>
            <a href="https://api.whatsapp.com/send?text=${encodeURIComponent(post.title + ' ' + shareUrl)}" target="_blank" class="px-3 py-1.5 bg-green-600 text-white text-xs font-semibold rounded hover:bg-green-700">WhatsApp</a>
            <a href="https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(post.title)}" target="_blank" class="px-3 py-1.5 bg-sky-600 text-white text-xs font-semibold rounded hover:bg-sky-700">Telegram</a>
          </div>
        </div>
      `;

      // Apply Ad placements
      const ad = getAdSettings();
      const adHtml = ad.code ? `<div class="my-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg text-center">${ad.code}</div>` : '';

      let bodyContent = post.content || '';

      if (ad.beforeFirstImage && adHtml) {
        bodyContent = bodyContent.replace(/(<img[^>]*>)/i, `${adHtml}$1`);
      }
      if (ad.betweenParagraphs && adHtml) {
        let pCount = 0;
        bodyContent = bodyContent.replace(/(<\/p>)/gi, (m) => {
          pCount++;
          return m + adHtml;
        });
      }

      container.innerHTML = `
        ${ad.beforeTitle && adHtml ? adHtml : ''}
        <h1 class="text-4xl font-extrabold text-gray-900 tracking-tight mb-2">${post.title}</h1>
        <div class="text-sm text-gray-500 mb-6">${post.date || ''}</div>
        ${featuredImg ? `<img src="${featuredImg}" alt="${post.title}" class="w-full max-h-[450px] object-cover rounded-xl mb-6 shadow-sm">` : ''}
        ${shareButtonsHtml}
        <div class="prose max-w-none text-gray-800 leading-relaxed">${bodyContent}</div>
        ${ad.afterPost && adHtml ? adHtml : ''}
      `;
    }

    function updateMetaTag(key, val, attr = "property") {
      let el = document.querySelector(`meta[${attr}="${key}"]`);
      if (!el) {
        el = document.createElement("meta");
        el.setAttribute(attr, key);
        document.head.appendChild(el);
      }
      el.setAttribute("content", val);
    }

    // Admin Authentication & Views
    function showAdminView() {
      document.getElementById("blog-view").classList.add("hidden");
      document.getElementById("admin-view").classList.remove("hidden");

      const isLoggedIn = sessionStorage.getItem("admin_logged_in") === "true";
      if (isLoggedIn) {
        document.getElementById("admin-login-card").classList.add("hidden");
        document.getElementById("admin-dashboard").classList.remove("hidden");
        switchAdminTab("posts");
      } else {
        document.getElementById("admin-login-card").classList.remove("hidden");
        document.getElementById("admin-dashboard").classList.hidden = false; // logic handled by removing hidden
        document.getElementById("admin-dashboard").classList.add("hidden");
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const u = document.getElementById("login-username").value;
      const p = document.getElementById("login-password").value;
      const creds = getAdminCredentials();

      if (u === creds.user && p === creds.pass) {
        sessionStorage.setItem("admin_logged_in", "true");
        document.getElementById("login-error").classList.add("hidden");
        showAdminView();
      } else {
        document.getElementById("login-error").classList.remove("hidden");
      }
    }

    function handleLogout() {
      sessionStorage.removeItem("admin_logged_in");
      showAdminView();
    }

    function switchAdminTab(tab, focusCreds = false) {
      ['posts', 'create', 'settings'].forEach(t => {
        const el = document.getElementById("admin-tab-" + t);
        const btn = document.getElementById("tab-btn-" + t);
        if (t === tab) {
          el.classList.remove("hidden");
          btn.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-indigo-600 text-white";
        } else {
          el.classList.add("hidden");
          btn.className = "px-4 py-2 text-sm font-semibold rounded-lg bg-gray-100 text-gray-700 hover:bg-gray-200";
        }
      });

      if (tab === 'posts') renderAdminPostsTable();
      if (tab === 'settings') {
        loadAdSettingsForm();
        const creds = getAdminCredentials();
        document.getElementById("new-admin-user").value = creds.user;
        document.getElementById("new-admin-pass").value = creds.pass;
        if (focusCreds) {
          document.getElementById("credentials-card").scrollIntoView({ behavior: "smooth" });
          document.getElementById("new-admin-user").focus();
        }
      }
    }

    function renderAdminPostsTable() {
      const posts = getPosts();
      const tbody = document.getElementById("admin-posts-tbody");
      tbody.innerHTML = "";

      posts.forEach(post => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-50";
        tr.innerHTML = `
          <td class="py-3 px-4 font-semibold text-gray-900">${post.title}</td>
          <td class="py-3 px-4 text-gray-500">${post.date || ''}</td>
          <td class="py-3 px-4 text-right space-x-2">
            <button onclick="editPost('${post.id}')" class="px-3 py-1 bg-indigo-50 text-indigo-600 rounded font-medium hover:bg-indigo-100">Edit</button>
            <button onclick="deletePost('${post.id}')" class="px-3 py-1 bg-red-50 text-red-600 rounded font-medium hover:bg-red-100">Delete</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function openNewPostForm() {
      document.getElementById("post-edit-id").value = "";
      document.getElementById("post-title").value = "";
      document.getElementById("featured-image-url").value = "";
      document.getElementById("featured-image-file").value = "";
      document.getElementById("featured-image-preview").src = "";
      document.getElementById("featured-image-preview-container").classList.add("hidden");
      document.getElementById("post-editor").innerHTML = "";
      document.getElementById("post-editor-heading").innerText = "Create New Post";

      switchAdminTab("create");
    }

    function editPost(id) {
      const posts = getPosts();
      const post = posts.find(p => String(p.id) === String(id));
      if (!post) return;

      document.getElementById("post-edit-id").value = post.id;
      document.getElementById("post-title").value = post.title;

      const img = post.featured_image || post.featuredImage || "";
      document.getElementById("featured-image-url").value = img;
      if (img) updateFeaturedImagePreview(img);
      else document.getElementById("featured-image-preview-container").classList.add("hidden");

      document.getElementById("post-editor").innerHTML = post.content || "";
      document.getElementById("post-editor-heading").innerText = "Edit Post";

      switchAdminTab("create");
    }

    function deletePost(id) {
      if (!confirm("Are you sure you want to delete this post?")) return;
      let posts = getPosts();
      posts = posts.filter(p => String(p.id) !== String(id));
      savePosts(posts);
      renderAdminPostsTable();
    }

    // Featured Image Upload & Preview
    function handleFeaturedImageFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        const dataUrl = evt.target.result;
        document.getElementById("featured-image-url").value = dataUrl;
        updateFeaturedImagePreview(dataUrl);
      };
      reader.readAsDataURL(file);
    }

    function updateFeaturedImagePreview(url) {
      const preview = document.getElementById("featured-image-preview");
      const container = document.getElementById("featured-image-preview-container");
      if (url && url.trim() !== "") {
        preview.src = url;
        container.classList.remove("hidden");
      } else {
        preview.src = "";
        container.classList.add("hidden");
      }
    }

    // Rich Text Editor Helpers
    function execCmd(command, value = null) {
      document.execCommand(command, false, value);
    }

    function handleMediaUpload(e) {
      const files = Array.from(e.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (evt) => {
          const res = evt.target.result;
          if (file.type.startsWith("image/")) {
            execCmd("insertHTML", `<img src="${res}" alt="Uploaded media" class="rounded-lg max-w-full my-4">`);
          } else if (file.type.startsWith("video/")) {
            execCmd("insertHTML", `<video src="${res}" controls class="rounded-lg max-w-full my-4"></video>`);
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function handlePasteMedia(e) {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.kind === 'file') {
          const file = item.getAsFile();
          if (!file) continue;
          e.preventDefault();
          const reader = new FileReader();
          reader.onload = (evt) => {
            const res = evt.target.result;
            if (file.type.startsWith("image/")) {
              execCmd("insertHTML", `<img src="${res}" alt="Pasted image" class="rounded-lg max-w-full my-4">`);
            } else if (file.type.startsWith("video/")) {
              execCmd("insertHTML", `<video src="${res}" controls class="rounded-lg max-w-full my-4"></video>`);
            }
          };
          reader.readAsDataURL(file);
        }
      }
    }

    // Save Post Handler
    function handleSavePost(e) {
      e.preventDefault();
      const id = document.getElementById("post-edit-id").value || String(Date.now());
      const title = document.getElementById("post-title").value;
      let featured_image = document.getElementById("featured-image-url").value;
      const content = document.getElementById("post-editor").innerHTML;

      // Automatic fallback to first image in post content if featured_image is empty
      if (!featured_image && content) {
        const match = content.match(/<img[^>]+src=["']([^"']+)["']/i);
        if (match) featured_image = match[1];
      }

      let posts = getPosts();
      const existingIdx = posts.findIndex(p => String(p.id) === String(id));

      const excerpt = content.replace(/<[^>]*>/g, '').slice(0, 160) + '...';
      const postObj = {
        id: id,
        title: title,
        date: existingIdx >= 0 ? (posts[existingIdx].date || new Date().toISOString().split('T')[0]) : new Date().toISOString().split('T')[0],
        featured_image: featured_image,
        excerpt: excerpt,
        content: content
      };

      if (existingIdx >= 0) {
        posts[existingIdx] = postObj;
      } else {
        posts.unshift(postObj);
      }

      savePosts(posts);
      switchAdminTab("posts");
    }

    // Change Credentials Handler
    function handleChangeCredentials(e) {
      e.preventDefault();
      const newU = document.getElementById("new-admin-user").value.trim();
      const newP = document.getElementById("new-admin-pass").value.trim();
      const msg = document.getElementById("credentials-msg");

      if (newU && newP) {
        localStorage.setItem("admin_username", newU);
        localStorage.setItem("admin_password", newP);
        msg.innerText = "✓ Credentials updated successfully!";
        msg.className = "text-sm font-medium text-green-600 block";
        setTimeout(() => msg.classList.add("hidden"), 4000);
      }
    }

    // Ad Placements Settings Handler
    function loadAdSettingsForm() {
      const ad = getAdSettings();
      document.getElementById("ad-before-title").checked = ad.beforeTitle;
      document.getElementById("ad-before-first-image").checked = ad.beforeFirstImage;
      document.getElementById("ad-between-paragraphs").checked = ad.betweenParagraphs;
      document.getElementById("ad-after-post").checked = ad.afterPost;
      document.getElementById("ad-code-input").value = ad.code || "";
    }

    function saveAdSettings() {
      const settings = {
        beforeTitle: document.getElementById("ad-before-title").checked,
        beforeFirstImage: document.getElementById("ad-before-first-image").checked,
        betweenParagraphs: document.getElementById("ad-between-paragraphs").checked,
        afterPost: document.getElementById("ad-after-post").checked,
        code: document.getElementById("ad-code-input").value
      };
      localStorage.setItem("cms_ad_settings", JSON.stringify(settings));
      alert("Ad settings saved successfully!");
    }
  </script>
</body>
</html>
