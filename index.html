<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JoltFeed - Professional Publication</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .reader-container { max-width: 680px; margin: 0 auto; }
    .prose img { width: 100%; border-radius: 8px; margin: 1.5rem 0; }
    .prose video { width: 100%; border-radius: 8px; margin: 1.5rem 0; }
    .prose iframe { width: 100%; aspect-ratio: 16/9; border-radius: 8px; margin: 1.5rem 0; }
    .ad-slot { width: 100%; min-height: 50px; margin: 1.5rem 0; text-align: center; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased min-h-screen flex flex-col">

  <!-- Ad Slot 1: Top Above Header Banner -->
  <div id="ad-slot-1-container" class="ad-slot bg-gray-100 border-b border-gray-200 py-2 hidden">
    <div id="ad_slot_1"></div>
  </div>

  <!-- Main Navigation Header -->
  <header class="bg-white border-b border-gray-200 sticky top-0 z-40 shadow-sm">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="./" onclick="navigateToHome(event)" class="flex items-center gap-2 group">
        <div class="bg-blue-600 text-white font-bold px-2.5 py-1 rounded text-lg tracking-wide">JF</div>
        <span class="text-xl font-black tracking-tight text-gray-900 group-hover:text-blue-600 transition">JoltFeed</span>
      </a>
      <div class="flex items-center space-x-4">
        <a href="./" onclick="navigateToHome(event)" class="text-sm font-semibold text-gray-700 hover:text-blue-600 transition">Home</a>
        <a href="./admin/" class="text-sm font-semibold text-white bg-blue-600 hover:bg-blue-700 px-3 py-1.5 rounded-lg shadow-sm transition">Admin CMS</a>
      </div>
    </div>
  </header>

  <!-- Ad Slot 2: Below Navigation Header -->
  <div id="ad-slot-2-container" class="ad-slot max-w-4xl mx-auto px-4 py-2 hidden">
    <div id="ad_slot_2"></div>
  </div>

  <!-- Article / Main Reader Container (Strict 680px Single Column) -->
  <main class="flex-grow py-8 px-4">
    <div class="reader-container" id="appContent">
      <div id="loading" class="text-center py-16">
        <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
        <p class="text-sm text-gray-500 mt-2">Loading publication...</p>
      </div>
    </div>
  </main>

  <!-- Ad Slot 8: Bottom Footer Banner -->
  <div id="ad-slot-8-container" class="ad-slot bg-gray-100 border-t border-gray-200 py-3 hidden">
    <div id="ad_slot_8"></div>
  </div>

  <footer class="bg-white border-t border-gray-200 py-8 text-center text-sm text-gray-500">
    <div class="max-w-4xl mx-auto px-4">
      <p>&copy; 2026 JoltFeed Publication. Powered by Cloudflare Workers.</p>
    </div>
  </footer>

  <script>
    let state = { posts: [], config: {} };

    window.addEventListener('DOMContentLoaded', async () => {
      loadState();
      await syncStateFromApi();
      renderApp();
    });

    function loadState() {
      if (window.__INITIAL_STATE__ && window.__INITIAL_STATE__.posts) {
        state = window.__INITIAL_STATE__;
        return;
      }
      try {
        const pRaw = localStorage.getItem('cms_posts') || localStorage.getItem('blog_posts_v3') || localStorage.getItem('joltfeed_posts');
        const cRaw = localStorage.getItem('cms_config') || localStorage.getItem('blog_config_v3');
        state.posts = pRaw ? JSON.parse(pRaw) : [];
        state.config = cRaw ? JSON.parse(cRaw) : {};
      } catch (e) {}
    }

    async function syncStateFromApi() {
      try {
        const res = await fetch('/api/state');
        if (res.ok) {
          const data = await res.json();
          if (data && data.posts && data.posts.length > 0) {
            state = data;
            localStorage.setItem('cms_posts', JSON.stringify(state.posts));
            if (state.config) localStorage.setItem('cms_config', JSON.stringify(state.config));
          }
        }
      } catch (e) {}
    }

    function navigateToHome(e) {
      if (e) e.preventDefault();
      history.pushState(null, '', './');
      renderApp();
    }

    function renderApp() {
      renderAds();
      const params = new URLSearchParams(window.location.search);
      const postId = params.get('p') || params.get('post') || params.get('id');

      if (postId) {
        const post = state.posts.find(item => String(item.id) === String(postId));
        if (post) {
          renderSinglePost(post);
          return;
        }
      }
      renderArticleFeed();
    }

    function renderAds() {
      const ads = state.config?.ads || {};
      for (let i = 1; i <= 8; i++) {
        const slotEl = document.getElementById(`ad_slot_${i}`);
        const containerEl = document.getElementById(`ad-slot-${i}-container`);
        const code = ads[`ad_slot_${i}`] || ads[`ad${i}`];
        if (code && slotEl) {
          slotEl.innerHTML = code;
          if (containerEl) containerEl.classList.remove('hidden');
        }
      }
    }

    function renderArticleFeed() {
      const container = document.getElementById('appContent');
      if (!container) return;

      if (!state.posts || state.posts.length === 0) {
        container.innerHTML = `
          <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 text-center">
            <h2 class="text-xl font-bold text-gray-800 mb-2">No Articles Yet</h2>
            <p class="text-gray-600 mb-4 text-sm">Check back soon or create articles in the admin dashboard.</p>
            <a href="./admin/" class="inline-block bg-blue-600 text-white font-semibold text-sm px-4 py-2 rounded-lg">Go to Admin CMS</a>
          </div>
        `;
        return;
      }

      container.innerHTML = `
        <div class="space-y-8">
          ${state.posts.map(post => `
            <article class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition">
              ${post.image || post.featured_image ? `
                <a href="?p=${post.id}">
                  <img src="${post.image || post.featured_image}" alt="${escapeHtml(post.title)}" class="w-full h-64 object-cover" />
                </a>
              ` : ''}
              <div class="p-6">
                <div class="flex items-center gap-2 mb-2">
                  <span class="bg-blue-50 text-blue-700 text-xs font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">${escapeHtml(post.category || 'General')}</span>
                  <span class="text-gray-400 text-xs">&bull;</span>
                  <span class="text-gray-500 text-xs">${escapeHtml(post.date || 'Recently')}</span>
                </div>
                <h2 class="text-2xl font-bold text-gray-900 mb-3 hover:text-blue-600 transition leading-snug">
                  <a href="?p=${post.id}">${escapeHtml(post.title)}</a>
                </h2>
                <p class="text-gray-600 text-sm leading-relaxed mb-4">${escapeHtml(post.excerpt || post.summary || '')}</p>
                <div class="flex items-center justify-between pt-4 border-t border-gray-100">
                  <a href="?p=${post.id}" class="text-blue-600 font-bold text-sm hover:underline flex items-center gap-1">Read Full Story &rarr;</a>
                  <span class="text-xs text-gray-400">JoltFeed</span>
                </div>
              </div>
            </article>
          `).join('')}
        </div>
      `;
    }

    function renderSinglePost(post) {
      const container = document.getElementById('appContent');
      if (!container) return;

      const ads = state.config?.ads || {};
      const ad3 = ads['ad_slot_3'] || ads['ad3'] ? `<div class="ad-slot my-4">${ads['ad_slot_3'] || ads['ad3']}</div>` : '';
      const ad4 = ads['ad_slot_4'] || ads['ad4'] ? `<div class="ad-slot my-4">${ads['ad_slot_4'] || ads['ad4']}</div>` : '';
      const ad5 = ads['ad_slot_5'] || ads['ad5'] ? `<div class="ad-slot my-4">${ads['ad_slot_5'] || ads['ad5']}</div>` : '';
      const ad6 = ads['ad_slot_6'] || ads['ad6'] ? `<div class="ad-slot my-4">${ads['ad_slot_6'] || ads['ad6']}</div>` : '';
      const ad7 = ads['ad_slot_7'] || ads['ad7'] ? `<div class="ad-slot my-4">${ads['ad_slot_7'] || ads['ad7']}</div>` : '';

      // Format content and inject mid-article ad slots at paragraph 2 and 4
      let contentHtml = post.content || '';
      const paragraphs = contentHtml.split('</p>');
      if (paragraphs.length > 2 && ad4) {
        paragraphs[1] = paragraphs[1] + '</p>' + ad4;
      }
      if (paragraphs.length > 4 && ad5) {
        paragraphs[3] = paragraphs[3] + '</p>' + ad5;
      }
      contentHtml = paragraphs.join(paragraphs.length <= 2 || paragraphs.length <= 4 ? '</p>' : '');

      container.innerHTML = `
        <article class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 md:p-8">
          ${ad3}

          <header class="mb-6">
            <div class="flex items-center gap-2 mb-3">
              <span class="bg-blue-50 text-blue-700 text-xs font-bold px-2.5 py-0.5 rounded-full uppercase tracking-wider">${escapeHtml(post.category || 'General')}</span>
              <span class="text-gray-400 text-xs">&bull;</span>
              <span class="text-gray-500 text-xs">${escapeHtml(post.date || 'Recently')}</span>
            </div>
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 tracking-tight leading-tight mb-4">${escapeHtml(post.title)}</h1>
            ${post.excerpt ? `<p class="text-lg text-gray-600 leading-relaxed font-normal">${escapeHtml(post.excerpt)}</p>` : ''}
          </header>

          ${post.image || post.featured_image ? `
            <div class="mb-6">
              <img src="${post.image || post.featured_image}" alt="${escapeHtml(post.title)}" class="w-full h-auto max-h-[420px] object-cover rounded-lg shadow-sm" />
            </div>
          ` : ''}

          <div class="prose max-w-none text-gray-800 leading-relaxed text-base">
            ${contentHtml}
          </div>

          ${ad6}

          <!-- Social Share & Like Section -->
          <div class="mt-8 pt-6 border-t border-gray-200 flex flex-wrap items-center justify-between gap-4">
            <button onclick="likeArticle()" id="likeBtn" class="flex items-center gap-2 bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2 rounded-lg font-bold text-sm transition">
              ❤️ Like Article (<span id="likeCount">12</span>)
            </button>
            <div class="flex items-center space-x-2">
              <span class="text-xs text-gray-500 font-semibold">Share:</span>
              <button onclick="shareLink()" class="px-3 py-1.5 bg-gray-100 hover:bg-gray-200 text-gray-700 rounded text-xs font-semibold">🔗 Copy Link</button>
            </div>
          </div>

          ${ad7}

          <!-- Comments Section -->
          <section class="mt-8 pt-8 border-t border-gray-200">
            <h3 class="text-lg font-bold text-gray-900 mb-4">Comments</h3>
            <div class="space-y-4 mb-6" id="commentsList">
              <div class="bg-gray-50 p-3.5 rounded-lg border border-gray-200 text-xs text-gray-700">
                <span class="font-bold text-gray-900">Alex M.</span>: Great article! Really enjoyed reading this.
              </div>
            </div>
            <form onsubmit="addComment(event)" class="flex gap-2">
              <input type="text" id="commentInput" placeholder="Write a comment..." required class="flex-1 text-xs p-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500" />
              <button type="submit" class="bg-blue-600 text-white font-semibold text-xs px-4 py-2.5 rounded-lg hover:bg-blue-700 transition">Post</button>
            </form>
          </section>

        </article>
      `;
    }

    function likeArticle() {
      const countEl = document.getElementById('likeCount');
      if (countEl) countEl.innerText = parseInt(countEl.innerText) + 1;
    }

    function shareLink() {
      navigator.clipboard.writeText(window.location.href);
      alert('Article link copied to clipboard!');
    }

    function addComment(e) {
      e.preventDefault();
      const input = document.getElementById('commentInput');
      const list = document.getElementById('commentsList');
      if (input && list && input.value.trim()) {
        const div = document.createElement('div');
        div.className = 'bg-gray-50 p-3.5 rounded-lg border border-gray-200 text-xs text-gray-700';
        div.innerHTML = `<span class="font-bold text-gray-900">Reader</span>: ${escapeHtml(input.value.trim())}`;
        list.appendChild(div);
        input.value = '';
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
  </script>
</body>
</html>
